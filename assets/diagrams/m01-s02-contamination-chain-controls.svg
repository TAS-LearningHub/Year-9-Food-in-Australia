<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contamination chain and control points</title>
  <desc id="desc">A contamination source can transfer through hands, utensils or surfaces to ready-to-eat food. Separation, hand hygiene, and cleaning followed by sanitising can interrupt the chain.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#9b4d3a"/></marker></defs>
  <rect width="1600" height="900" rx="36" fill="#f8fbfa"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#173f3c">Break the contamination chain</text>
  <text x="80" y="136" font-family="Arial, sans-serif" font-size="24" fill="#47615e">Trace what touched what, then place a control before contamination reaches ready-to-eat food.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(85 230)"><circle cx="135" cy="130" r="125" fill="#f5ddd7" stroke="#a44d39" stroke-width="5"/><text x="135" y="112" text-anchor="middle" font-size="28" font-weight="700" fill="#692e22">SOURCE</text><text x="135" y="153" text-anchor="middle" font-size="23" fill="#4a342f">uncooked food</text><text x="135" y="185" text-anchor="middle" font-size="23" fill="#4a342f">or another contaminant</text></g>
    <path d="M355 360H520" stroke="#9b4d3a" stroke-width="10" marker-end="url(#arrow)"/>
    <g transform="translate(545 230)"><rect width="420" height="260" rx="42" fill="#fff1cf" stroke="#c28b27" stroke-width="5"/><text x="210" y="80" text-anchor="middle" font-size="29" font-weight="700" fill="#6b4b16">TRANSFER ROUTE</text><text x="210" y="132" text-anchor="middle" font-size="24" fill="#4a3d29">hand • utensil • cloth • surface</text><text x="210" y="184" text-anchor="middle" font-size="22" fill="#4a3d29">More than one route may be present.</text></g>
    <path d="M985 360H1150" stroke="#9b4d3a" stroke-width="10" marker-end="url(#arrow)"/>
    <g transform="translate(1175 230)"><circle cx="170" cy="130" r="125" fill="#dceeea" stroke="#2b6f68" stroke-width="5"/><text x="170" y="106" text-anchor="middle" font-size="28" font-weight="700" fill="#173f3c">DESTINATION</text><text x="170" y="151" text-anchor="middle" font-size="23" fill="#294744">ready-to-eat food</text><text x="170" y="183" text-anchor="middle" font-size="21" fill="#294744">needs protection</text></g>
    <g transform="translate(190 580)">
      <rect width="1220" height="230" rx="34" fill="#ffffff" stroke="#83b7ae" stroke-width="4"/>
      <text x="610" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#173f3c">CONTROL POINTS — stop transfer before it reaches the destination</text>
      <g transform="translate(45 85)"><rect width="340" height="105" rx="22" fill="#e8f4f1"/><text x="170" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#245f59">SEPARATE</text><text x="170" y="76" text-anchor="middle" font-size="20" fill="#294744">foods, tools and work zones</text></g>
      <g transform="translate(440 85)"><rect width="340" height="105" rx="22" fill="#e8f4f1"/><text x="170" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#245f59">RESET HAND HYGIENE</text><text x="170" y="76" text-anchor="middle" font-size="20" fill="#294744">after a contamination event</text></g>
      <g transform="translate(835 85)"><rect width="340" height="105" rx="22" fill="#e8f4f1"/><text x="170" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#245f59">CLEAN → SANITISE</text><text x="170" y="76" text-anchor="middle" font-size="20" fill="#294744">in that order, when required</text></g>
    </g>
  </g>
</svg>
