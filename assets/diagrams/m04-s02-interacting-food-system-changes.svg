<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Interacting changes in food access and choice</title>
  <desc id="desc">Several colonial conditions may interact with food-system effects and nutrition implications. The diagram stresses variation by place and time and avoids a simple before-and-after story.</desc>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#6a7774"/></marker></defs>
  <rect width="1600" height="900" rx="36" fill="#fffaf2"/>
  <text x="80" y="86" font-family="Arial, sans-serif" font-size="49" font-weight="700" fill="#183f3d">Conditions interacted—there was no single pathway</text>
  <text x="80" y="134" font-family="Arial, sans-serif" font-size="24" fill="#4b625e">Use “may” and “could” until a place-specific source supports a stronger claim.</text>
  <g font-family="Arial, sans-serif">
    <text x="270" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#692e22">COLONIAL CONDITIONS</text>
    <text x="800" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#604514">FOOD-SYSTEM EFFECTS</text>
    <text x="1330" y="210" text-anchor="middle" font-size="25" font-weight="700" fill="#264a61">POSSIBLE NUTRITION IMPLICATIONS</text>
    <g fill="#f5e1dc" stroke="#a44d39" stroke-width="4">
      <rect x="80" y="260" width="380" height="110" rx="25"/><rect x="80" y="410" width="380" height="110" rx="25"/><rect x="80" y="560" width="380" height="110" rx="25"/>
    </g>
    <g text-anchor="middle" font-size="23" fill="#4e302a"><text x="270" y="305">restricted access to Country</text><text x="270" y="339">in a particular context</text><text x="270" y="455">imposed movement or</text><text x="270" y="489">settlement controls</text><text x="270" y="605">environmental change and</text><text x="270" y="639">changed resource access</text></g>
    <g fill="#fff0cf" stroke="#c28b27" stroke-width="4">
      <rect x="610" y="260" width="380" height="110" rx="25"/><rect x="610" y="410" width="380" height="110" rx="25"/><rect x="610" y="560" width="380" height="110" rx="25"/>
    </g>
    <g text-anchor="middle" font-size="23" fill="#4b3e29"><text x="800" y="305">reduced or interrupted</text><text x="800" y="339">resource access</text><text x="800" y="455">greater reliance on</text><text x="800" y="489">supplied foods</text><text x="800" y="605">less variety and fewer</text><text x="800" y="639">available choices</text></g>
    <g fill="#e6eff6" stroke="#4f83a6" stroke-width="4">
      <rect x="1140" y="260" width="380" height="110" rx="25"/><rect x="1140" y="410" width="380" height="110" rx="25"/><rect x="1140" y="560" width="380" height="110" rx="25"/>
    </g>
    <g text-anchor="middle" font-size="23" fill="#334d5d"><text x="1330" y="305">changed nutrient variety</text><text x="1330" y="339">may result</text><text x="1330" y="455">food quality and balance</text><text x="1330" y="489">could change</text><text x="1330" y="605">effects can differ across</text><text x="1330" y="639">people, places and time</text></g>
    <g fill="none" stroke="#6a7774" stroke-width="6" opacity=".8" marker-end="url(#arr)"><path d="M470 315 C530 315 540 315 600 315"/><path d="M470 315 C530 315 540 455 600 455"/><path d="M470 465 C530 465 540 455 600 455"/><path d="M470 465 C530 465 540 605 600 605"/><path d="M470 615 C530 615 540 315 600 315"/><path d="M470 615 C530 615 540 605 600 605"/><path d="M1000 315 C1060 315 1070 315 1130 315"/><path d="M1000 315 C1060 315 1070 455 1130 455"/><path d="M1000 455 C1060 455 1070 455 1130 455"/><path d="M1000 605 C1060 605 1070 605 1130 605"/></g>
    <rect x="250" y="740" width="1100" height="84" rx="28" fill="#e7f1ee" stroke="#91b9b1" stroke-width="3"/>
    <text x="800" y="776" text-anchor="middle" font-size="23" font-weight="700" fill="#183f3d">The task is to explain a supported relationship—not to claim one universal experience.</text>
    <text x="800" y="808" text-anchor="middle" font-size="20" fill="#405653">Cross-check evidence and include continuity, adaptation and Community perspectives where authorised.</text>
  </g>
</svg>
