<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">From a broad stereotype to a careful conclusion</title>
  <desc id="desc">A four-stage research funnel narrows a broad assumption into a specific question, a varied evidence set and a qualified conclusion, with a side path showing when to revise or ask for cultural guidance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#fff5ea"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#243b53" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6f78"/></marker>
    <style>.title{font:700 46px Arial,sans-serif;fill:#183b4b}.sub{font:400 22px Arial,sans-serif;fill:#526a73}.step{fill:#fff;stroke-width:3}.num{font:700 24px Arial,sans-serif;fill:#fff}.h{font:700 27px Arial,sans-serif;fill:#183b4b}.body{font:400 20px Arial,sans-serif;fill:#405a64}.small{font:700 18px Arial,sans-serif;fill:#7b3f14}.arrow{stroke:#2d6f78;stroke-width:5;fill:none;marker-end:url(#arrow)}.tag{font:700 18px Arial,sans-serif}</style>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <text x="85" y="84" class="title">From a broad stereotype to a careful conclusion</text>
  <text x="87" y="124" class="sub">Narrow the context, vary the evidence and claim only what the evidence supports.</text>

  <g filter="url(#shadow)"><path d="M160 195H1440L1330 352H270Z" fill="#fff" stroke="#d26c4a" stroke-width="3"/>
    <circle cx="220" cy="272" r="31" fill="#b54834"/><text x="220" y="281" text-anchor="middle" class="num">1</text>
    <text x="292" y="247" class="h">Spot the broad assumption</text><text x="292" y="284" class="body">“Everyone in a culture eats the same way” is too broad to investigate.</text>
    <rect x="1132" y="237" width="220" height="52" rx="26" fill="#fff0eb" stroke="#d26c4a" stroke-width="2"/><text x="1242" y="271" text-anchor="middle" class="tag" fill="#9c3d2e">REJECT THE CLAIM</text></g>
  <path class="arrow" d="M800 352V385"/>
  <g filter="url(#shadow)"><path d="M270 392H1330L1230 547H370Z" fill="#fff" stroke="#d9a338" stroke-width="3"/>
    <circle cx="330" cy="468" r="31" fill="#a56d07"/><text x="330" y="477" text-anchor="middle" class="num">2</text>
    <text x="402" y="443" class="h">Ask a specific question</text><text x="402" y="476" class="body">Name the place, group or practice,</text><text x="402" y="504" class="body">then the time or circumstance you can study.</text>
    <rect x="1080" y="430" width="160" height="52" rx="26" fill="#fff6de" stroke="#d9a338" stroke-width="2"/><text x="1160" y="464" text-anchor="middle" class="tag" fill="#7d570c">NARROW</text></g>
  <path class="arrow" d="M800 547V580"/>
  <g filter="url(#shadow)"><path d="M370 587H1230L1140 742H460Z" fill="#fff" stroke="#3b8c85" stroke-width="3"/>
    <circle cx="430" cy="663" r="31" fill="#25766f"/><text x="430" y="672" text-anchor="middle" class="num">3</text>
    <text x="502" y="638" class="h">Build varied evidence</text><text x="502" y="671" class="body">Combine credible community, historical</text><text x="502" y="699" class="body">and research perspectives suited to the question.</text>
    <rect x="970" y="625" width="178" height="52" rx="26" fill="#e8f7f4" stroke="#3b8c85" stroke-width="2"/><text x="1059" y="659" text-anchor="middle" class="tag" fill="#1c655f">CROSS-CHECK</text></g>
  <path class="arrow" d="M800 742V775"/>
  <g filter="url(#shadow)"><path d="M460 782H1140L1060 922H540Z" fill="#fff" stroke="#526e9f" stroke-width="3"/>
    <circle cx="520" cy="852" r="31" fill="#405d91"/><text x="520" y="861" text-anchor="middle" class="num">4</text>
    <text x="592" y="827" class="h">Write a qualified conclusion</text><text x="592" y="860" class="body">State the supported pattern,</text><text x="592" y="888" class="body">then name the context and limits.</text>
    <rect x="920" y="815" width="154" height="52" rx="26" fill="#edf2ff" stroke="#526e9f" stroke-width="2"/><text x="997" y="849" text-anchor="middle" class="tag" fill="#354f81">LIMIT CLAIM</text></g>

  <path d="M1290 605C1460 630 1470 800 1265 840" fill="none" stroke="#9b6a35" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <rect x="1195" y="665" width="325" height="104" rx="22" fill="#fff8e9" stroke="#c58b45" stroke-width="3"/><text x="1358" y="704" text-anchor="middle" class="h">Pause and check</text><text x="1358" y="737" text-anchor="middle" class="body">Ask when authority, context or</text><text x="1358" y="764" text-anchor="middle" class="body">cultural guidance is unclear.</text>
</svg>
