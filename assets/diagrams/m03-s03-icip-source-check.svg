<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Research and ICIP source check</title>
  <desc id="desc">A decision pathway asks who created a source, what the source permits, whether cultural authority is clear and what the intended use is, leading to use with attribution, ask and confirm, or do not publish.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#2b6f68"/></marker></defs>
  <rect width="1600" height="900" rx="36" fill="#f8fbfa"/>
  <text x="80" y="86" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#183f3d">Pause before you use or publish</text>
  <text x="80" y="134" font-family="Arial, sans-serif" font-size="24" fill="#4b625e">Finding information online does not remove ownership, attribution or permission responsibilities.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(85 220)"><rect width="310" height="190" rx="28" fill="#fff" stroke="#2b6f68" stroke-width="5"/><text x="155" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#183f3d">1 · CREATOR</text><text x="155" y="104" text-anchor="middle" font-size="21" fill="#405653">Who made or shared</text><text x="155" y="134" text-anchor="middle" font-size="21" fill="#405653">this information?</text><text x="155" y="169" text-anchor="middle" font-size="18" fill="#657572">Can you name the source?</text></g>
    <path d="M410 315H465" stroke="#2b6f68" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(480 220)"><rect width="310" height="190" rx="28" fill="#fff" stroke="#4f83a6" stroke-width="5"/><text x="155" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#264a61">2 · RIGHTS</text><text x="155" y="104" text-anchor="middle" font-size="21" fill="#405653">What does the source</text><text x="155" y="134" text-anchor="middle" font-size="21" fill="#405653">allow you to do?</text><text x="155" y="169" text-anchor="middle" font-size="18" fill="#657572">Access is not permission.</text></g>
    <path d="M805 315H860" stroke="#2b6f68" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(875 220)"><rect width="310" height="190" rx="28" fill="#fff" stroke="#c28b27" stroke-width="5"/><text x="155" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#604514">3 · AUTHORITY</text><text x="155" y="104" text-anchor="middle" font-size="21" fill="#405653">Is cultural authority</text><text x="155" y="134" text-anchor="middle" font-size="21" fill="#405653">and context clear?</text><text x="155" y="169" text-anchor="middle" font-size="18" fill="#657572">Do not fill gaps yourself.</text></g>
    <path d="M1200 315H1255" stroke="#2b6f68" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(1270 220)"><rect width="245" height="190" rx="28" fill="#fff" stroke="#9166a8" stroke-width="5"/><text x="122" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#573c67">4 · PURPOSE</text><text x="122" y="104" text-anchor="middle" font-size="20" fill="#405653">Is this use suitable</text><text x="122" y="134" text-anchor="middle" font-size="20" fill="#405653">for this audience?</text><text x="122" y="169" text-anchor="middle" font-size="18" fill="#657572">Use only what is needed.</text></g>
    <path d="M1392 425V510" stroke="#2b6f68" stroke-width="8" marker-end="url(#arrow)"/>
    <path d="M1030 425V510" stroke="#2b6f68" stroke-width="8" marker-end="url(#arrow)"/>
    <path d="M635 425V510" stroke="#2b6f68" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(170 560)"><rect width="360" height="205" rx="30" fill="#e3f1ed" stroke="#2b6f68" stroke-width="5"/><text x="180" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#183f3d">USE CAREFULLY</text><text x="180" y="103" text-anchor="middle" font-size="21" fill="#405653">Stay within the evidence,</text><text x="180" y="134" text-anchor="middle" font-size="21" fill="#405653">attribute the source and</text><text x="180" y="165" text-anchor="middle" font-size="21" fill="#405653">preserve its context.</text></g>
    <g transform="translate(620 560)"><rect width="360" height="205" rx="30" fill="#fff0cf" stroke="#c28b27" stroke-width="5"/><text x="180" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#604514">ASK / CONFIRM</text><text x="180" y="103" text-anchor="middle" font-size="21" fill="#405653">Pause when ownership,</text><text x="180" y="134" text-anchor="middle" font-size="21" fill="#405653">permission or local context</text><text x="180" y="165" text-anchor="middle" font-size="21" fill="#405653">is not clear.</text></g>
    <g transform="translate(1070 560)"><rect width="360" height="205" rx="30" fill="#f5e1dc" stroke="#a44d39" stroke-width="5"/><text x="180" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#692e22">DO NOT PUBLISH</text><text x="180" y="103" text-anchor="middle" font-size="21" fill="#405653">Do not share restricted,</text><text x="180" y="134" text-anchor="middle" font-size="21" fill="#405653">private or unauthorised</text><text x="180" y="165" text-anchor="middle" font-size="21" fill="#405653">material.</text></g>
  </g>
</svg>
