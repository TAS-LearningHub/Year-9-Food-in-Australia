<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">How a food technology changes a system</title>
  <desc id="desc">An analysis pathway moves from a driver or problem through a broad mechanism to affected parts of a food system, possible benefits and possible trade-offs. Four example technology tracks show that technologies can coexist and continue rather than forming one progress ladder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8fb"/><stop offset="1" stop-color="#fff8ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#253b52" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3c6f86"/></marker>
    <style>.title{font:700 46px Arial,sans-serif;fill:#19384a}.sub{font:400 22px Arial,sans-serif;fill:#536a76}.card{fill:#fff;stroke:#9cbfc9;stroke-width:3}.h{font:700 20px Arial,sans-serif;fill:#19384a}.body{font:400 17px Arial,sans-serif;fill:#465f6b}.small{font:400 16px Arial,sans-serif;fill:#4b626b}.tag{font:700 18px Arial,sans-serif}.line{stroke:#3c6f86;stroke-width:5;fill:none;marker-end:url(#arrow)}.track{fill:#fff;stroke-width:3}.trackText{font:700 20px Arial,sans-serif;fill:#263f4a}</style>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <text x="82" y="82" class="title">How a food technology changes a system</text>
  <text x="84" y="122" class="sub">Analyse the problem, mechanism, system effects and trade-offs — not just whether it is “old” or “new”.</text>

  <g filter="url(#shadow)"><rect class="card" x="70" y="205" width="270" height="190" rx="24"/><circle cx="115" cy="250" r="25" fill="#2f6e86"/><text x="115" y="259" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">1</text><text x="154" y="258" class="h">Driver or problem</text><text x="110" y="289" class="body">What need is being</text><text x="110" y="312" class="body">addressed?</text><text x="110" y="342" class="small">preservation • labour</text><text x="110" y="365" class="small">scale • access</text><text x="110" y="388" class="small">consistency • transport</text></g>
  <path class="line" d="M340 300H390"/>
  <g filter="url(#shadow)"><rect class="card" x="400" y="205" width="270" height="190" rx="24"/><circle cx="445" cy="250" r="25" fill="#2f6e86"/><text x="445" y="259" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">2</text><text x="484" y="258" class="h">Broad mechanism</text><text x="440" y="289" class="body">What does it change</text><text x="440" y="312" class="body">or control?</text><text x="440" y="342" class="small">particle size • moisture</text><text x="440" y="365" class="small">temperature • exposure</text><text x="440" y="388" class="small">movement</text></g>
  <path class="line" d="M670 300H720"/>
  <g filter="url(#shadow)"><rect class="card" x="730" y="205" width="270" height="190" rx="24"/><circle cx="775" cy="250" r="25" fill="#2f6e86"/><text x="775" y="259" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">3</text><text x="814" y="258" class="h">System parts</text><text x="770" y="289" class="body">Where are effects</text><text x="770" y="312" class="body">experienced?</text><text x="770" y="342" class="small">production • labour • storage</text><text x="770" y="365" class="small">transport • access</text><text x="770" y="388" class="small">food qualities</text></g>
  <path class="line" d="M1000 300H1050"/>
  <g filter="url(#shadow)"><rect class="card" x="1060" y="205" width="215" height="190" rx="24" stroke="#7bb39d"/><text x="1168" y="258" text-anchor="middle" class="h">Possible benefit</text><text x="1100" y="306" class="body">Who benefits?</text><text x="1100" y="340" class="body">In which context?</text><text x="1100" y="374" class="body">What evidence?</text></g>
  <path class="line" d="M1275 300H1325"/>
  <g filter="url(#shadow)"><rect class="card" x="1335" y="205" width="195" height="190" rx="24" stroke="#d09b6f"/><text x="1433" y="258" text-anchor="middle" class="h">Trade-off</text><text x="1371" y="306" class="body">What cost, limit</text><text x="1371" y="338" class="body">or new demand</text><text x="1371" y="370" class="body">may appear?</text></g>

  <text x="80" y="474" class="h">FOUR EXAMPLE TRACKS — compare, connect and question</text>
  <g filter="url(#shadow)"><rect class="track" x="80" y="515" width="335" height="135" rx="24" stroke="#7aa6bd"/><text x="115" y="555" class="trackText">GRINDING + MILLING</text><text x="115" y="587" class="body">Changes particle size.</text><text x="115" y="613" class="body">May affect labour or texture,</text><text x="115" y="639" class="body">and shape later processing.</text></g>
  <g filter="url(#shadow)"><rect class="track" x="450" y="515" width="335" height="135" rx="24" stroke="#8cae82"/><text x="485" y="555" class="trackText">PRESERVING</text><text x="485" y="587" class="body">Changes storage possibilities.</text><text x="485" y="613" class="body">May change food qualities</text><text x="485" y="639" class="body">or resource use.</text></g>
  <g filter="url(#shadow)"><rect class="track" x="820" y="515" width="335" height="135" rx="24" stroke="#9d91c1"/><text x="855" y="555" class="trackText">CHILLING</text><text x="855" y="587" class="body">Changes temperature control</text><text x="855" y="613" class="body">and access. May require</text><text x="855" y="639" class="body">equipment and energy.</text></g>
  <g filter="url(#shadow)"><rect class="track" x="1190" y="515" width="335" height="135" rx="24" stroke="#d1a268"/><text x="1225" y="560" class="trackText">TRANSPORT</text><text x="1225" y="596" class="body">Changes movement and availability.</text><text x="1225" y="625" class="body">Effects depend on place and scale.</text></g>

  <path d="M247 683C450 770 1145 770 1358 683" fill="none" stroke="#78919a" stroke-width="4" stroke-dasharray="12 10"/>
  <g filter="url(#shadow)"><rect x="250" y="742" width="1100" height="150" rx="30" fill="#fff" stroke="#8caeb0" stroke-width="3"/><text x="800" y="792" text-anchor="middle" class="h">COEXISTENCE, CONTINUITY AND CHANGE</text><text x="800" y="833" text-anchor="middle" class="body">A technology may continue, adapt or operate beside other technologies.</text><text x="800" y="866" text-anchor="middle" class="body">Do not assume that newer automatically means better, or that one effect applies everywhere.</text></g>
  <text x="800" y="955" text-anchor="middle" class="tag" fill="#7b4a16">NOTICE: Name the context before judging the importance of a benefit or trade-off.</text>
</svg>
