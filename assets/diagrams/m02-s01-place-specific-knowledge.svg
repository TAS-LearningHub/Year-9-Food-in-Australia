<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Food knowledge is place-specific</title>
  <desc id="desc">An unbordered outline of Australia with varied location markers sits beside a four-question source check, making clear that a map shows geography but cannot grant cultural permission.</desc>
  <rect width="1600" height="900" rx="36" fill="#fffaf2"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#183f3d">One continent does not mean one knowledge system</text>
  <text x="80" y="138" font-family="Arial, sans-serif" font-size="24" fill="#4c625e">Food knowledge is living, local and connected to particular people and places.</text>
  <g transform="translate(90 215)">
    <rect width="650" height="570" rx="34" fill="#eaf2eb" stroke="#9dbca7" stroke-width="4"/>
    <path d="M174 127 L250 76 L334 82 L390 55 L484 100 L528 170 L575 210 L545 275 L563 337 L503 375 L469 455 L375 484 L302 444 L229 460 L190 402 L128 364 L116 294 L72 247 L115 195 Z" fill="#f1d7a7" stroke="#926b32" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#2b6f68" stroke="#fff" stroke-width="5"><circle cx="176" cy="252" r="18"/><rect x="280" y="151" width="34" height="34" rx="7"/><path d="M427 198 l20 35 h-40z"/><circle cx="458" cy="340" r="18"/><rect x="315" y="352" width="34" height="34" rx="17"/><path d="M232 344 l20 35 h-40z"/></g>
    <text x="325" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183f3d">Geographic outline only — no Nation boundaries</text>
  </g>
  <g transform="translate(800 215)" font-family="Arial, sans-serif">
    <rect width="710" height="570" rx="34" fill="#ffffff" stroke="#d4b66e" stroke-width="4"/>
    <text x="42" y="60" font-size="28" font-weight="700" fill="#5f4616">Before using a food-knowledge claim, ask:</text>
    <g transform="translate(42 100)"><circle cx="28" cy="28" r="28" fill="#2b6f68"/><text x="28" y="37" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="76" y="24" font-size="25" font-weight="700" fill="#183f3d">Which place?</text><text x="76" y="56" font-size="21" fill="#405653">Avoid claiming that one example applies everywhere.</text></g>
    <g transform="translate(42 205)"><circle cx="28" cy="28" r="28" fill="#4f83a6"/><text x="28" y="37" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="76" y="24" font-size="25" font-weight="700" fill="#183f3d">Whose knowledge?</text><text x="76" y="56" font-size="21" fill="#405653">Name the source or Community when authorised.</text></g>
    <g transform="translate(42 310)"><circle cx="28" cy="28" r="28" fill="#c28b27"/><text x="28" y="37" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="76" y="24" font-size="25" font-weight="700" fill="#183f3d">What may be shared?</text><text x="76" y="56" font-size="21" fill="#405653">Public availability is not the same as permission.</text></g>
    <g transform="translate(42 415)"><circle cx="28" cy="28" r="28" fill="#a44d39"/><text x="28" y="37" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="76" y="24" font-size="25" font-weight="700" fill="#183f3d">How certain is the context?</text><text x="76" y="56" font-size="21" fill="#405653">Qualify, ask or mark Teacher to confirm.</text></g>
    <rect x="42" y="508" width="626" height="42" rx="21" fill="#f5e6c9"/><text x="355" y="536" text-anchor="middle" font-size="20" font-weight="700" fill="#6b4b16">A map shows location. It does not grant cultural authority.</text>
  </g>
</svg>
